name: Build Python+TA-Lib Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker images sequentially
        run: |
          PYTHON_VERSIONS=("3.9" "3.10" "3.11" "3.12" "3.13" "3.14")
          TA_LIB_VERSIONS=("0.6.4")

          for py in "${PYTHON_VERSIONS[@]}"; do
            for talib in "${TA_LIB_VERSIONS[@]}"; do
              IMAGE=ghcr.io/${{ github.repository_owner }}/python-${py}-talib-${talib}
              echo "Building $IMAGE"
              
              # Build image with no cache, fail fast
              docker build \
                --no-cache \
                --build-arg PYTHON_VERSION=$py \
                --build-arg TA_LIB_VERSION=$talib \
                -t $IMAGE \
                -f dockers/Dockerfile.ta-lib || exit 1

              echo "Pushing $IMAGE"
              docker push $IMAGE || exit 1
            done
          done
