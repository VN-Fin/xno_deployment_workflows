name: Deploy Web1 — Staging

on:
  push:
    branches: [staging]
    paths:
      - 'web1/**'
  workflow_dispatch:

jobs:
  deploy:
    uses: vn-fin/xno_deployment_workflows/.github/workflows/new-worflow-swarm.yml@main
    with:
      environment: staging
      services: web1          # builds from web1/ → image var ${web1} in compose
      stack: web1             # swarm stack name: web1-staging
      compose_file: docker-compose.web1.yml
      node_role: "worker"
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
