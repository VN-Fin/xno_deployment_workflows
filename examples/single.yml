name: Deploy Single Service (Example)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: vn-fin/xno_deployment_workflows/.github/workflows/workflow-swarm.yml@main
    with:
      environment: dev
      services: root        # "root" = single service at repo root
      stack: myapp
      node_label: "role == worker"
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
