version: '3.8'

# Deploy one stack per environment:
#   RUN_ENV=dev     TRAEFIK_PORT=8081 docker stack deploy -c docker-compose.traefik.yml traefik-dev
#   RUN_ENV=staging TRAEFIK_PORT=8082 docker stack deploy -c docker-compose.traefik.yml traefik-staging
#   RUN_ENV=prod    TRAEFIK_PORT=8083 docker stack deploy -c docker-compose.traefik.yml traefik-prod

services:
  traefik:
    image: traefik:v3.6
    command:
      # Swarm provider (v3 — separate from docker provider)
      - "--providers.swarm=true"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.exposedByDefault=false"
      - "--providers.swarm.network=traefik-${RUN_ENV}"
      # Only discover services tagged for this environment — prevents cross-env routing
      - --providers.swarm.constraints=Label(`traefik.env`,`${RUN_ENV}`)
      # Entrypoint exposed to nginx
      - "--entrypoints.web.address=:80"
      # Dashboard — accessible at http://manager:${TRAEFIK_PORT}/dashboard/ (no separate port needed)
      - "--api.dashboard=true"
      - "--api.insecure=true"
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "${TRAEFIK_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-net
    deploy:
      replicas: 1
      placement:
        constraints:
          # Traefik must run on manager to read docker socket / swarm API
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s

networks:
  traefik-net:
    external: true
    name: traefik-${RUN_ENV}
