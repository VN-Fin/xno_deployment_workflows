version: '3.8'

# Variables resolved by envsubst before `docker stack deploy`:
#   ${web1}                   — image tag built from web1/Dockerfile
#   ${RUN_ENV}                — deployment environment: dev | staging | prod
#   ${NODE_ROLE}              — swarm placement constraint (e.g. "worker")

services:
  web1:
    image: ${web1}
    networks:
      - traefik-net

    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"

    deploy:
      replicas: ${WEB_REPLICAS:-2}
      rollback_config:
        parallelism: 1
        order: stop-first
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 30s # Give the new container more time to healthcheck before killing the old one
      restart_policy:
        condition: on-failure # Only restart if it actually crashes
        delay: 15s
        max_attempts: 15 # Be aggressive here for post-reboot recovery
        window: 600s

      placement:
        constraints:
          - node.role == ${NODE_ROLE}
          - node.labels.env == ${RUN_ENV}

      labels:
        - "traefik.enable=true"
        - "traefik.env=${RUN_ENV}"
        - "traefik.http.routers.web1_${RUN_ENV}.rule=Host(`web1.${RUN_ENV}.example.com`)"
        - "traefik.http.routers.web1_${RUN_ENV}.entrypoints=web"
        - "traefik.http.services.web1_${RUN_ENV}.loadbalancer.server.port=80"

networks:
  traefik-net:
    external: true
    name: traefik-${RUN_ENV}
