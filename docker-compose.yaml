version: '3.8'

# Variables resolved by envsubst before `docker stack deploy`:
#   ${root}                   — image tag from the build job (e.g. ghcr.io/org/repo/dev-app:abc1234)
#   ${RUN_ENV}                — deployment environment: dev | staging | prod
#   ${NODE_LABEL_CONSTRAINT}  — swarm placement constraint (e.g. "role == worker")

x-common-deploy: &common-deploy
  update_config:
    parallelism: 1
    order: start-first
    failure_action: rollback
    delay: 10s
  rollback_config:
    parallelism: 1
    order: stop-first
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 3
    window: 120s
  placement:
    constraints:
      - node.labels.${NODE_LABEL_CONSTRAINT}

services:
  api:
    image: ${root}
    entrypoint: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      RUN_ENV: ${RUN_ENV}
    networks:
      - traefik-net
      - app-net
    deploy:
      <<: *common-deploy
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.env=${RUN_ENV}"
        # HTTP router
        - "traefik.http.routers.hello_${RUN_ENV}.rule=PathPrefix(`/hello-api`)"
        - "traefik.http.routers.hello_${RUN_ENV}.entrypoints=web"
        - "traefik.http.services.hello_${RUN_ENV}.loadbalancer.server.port=8000"

  grpc:
    image: ${root}
    entrypoint: ["python", "grpc_server.py"]
    environment:
      RUN_ENV: ${RUN_ENV}
    networks:
      - traefik-net
      - app-net
    deploy:
      <<: *common-deploy
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.env=${RUN_ENV}"
        # gRPC router — catch-all on grpc entrypoint (includes reflection path)
        # For multiple gRPC services, use PathPrefix(`/package.Service`) per service
        # and add a separate router for `/grpc.reflection` pointing to one of them.
        - "traefik.http.routers.hello_grpc_${RUN_ENV}.rule=PathPrefix(`/`)"
        - "traefik.http.routers.hello_grpc_${RUN_ENV}.entrypoints=grpc"
        - "traefik.http.services.hello_grpc_${RUN_ENV}.loadbalancer.server.port=50051"
        - "traefik.http.services.hello_grpc_${RUN_ENV}.loadbalancer.server.scheme=h2c"

networks:
  app-net:
    external: true
  traefik-net:
    external: true
    name: traefik-${RUN_ENV}
