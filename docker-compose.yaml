version: '3.8'

# Variables resolved by envsubst before `docker stack deploy`:
#   ${root}                   — image tag from the build job (e.g. ghcr.io/org/repo/dev-app:abc1234)
#   ${RUN_ENV}                — deployment environment: dev | staging | prod
#   ${NODE_ROLE}              — swarm placement constraint (e.g. "worker")

x-common-deploy: &common-deploy
  replicas: 1

  rollback_config:
    parallelism: 1
    order: stop-first

  update_config:
    parallelism: 1
    order: start-first
    failure_action: rollback
    delay: 30s # Give the new container more time to healthcheck before killing the old one

  restart_policy:
    condition: on-failure # Only restart if it actually crashes
    delay: 15s
    max_attempts: 15 # Be aggressive here for post-reboot recovery
    window: 600s

  placement:
    constraints:
      - node.labels.role == ${NODE_ROLE}
      - node.labels.env == ${RUN_ENV}

# for the services
services:
  api01:
    image: ${root}
    entrypoint: [ "uvicorn", "api_server_01:app", "--host", "0.0.0.0", "--port", "8000" ]
    environment:
      RUN_ENV: ${RUN_ENV}
    networks:
      - traefik-net
      - app-net
    deploy:
      <<: *common-deploy
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.env=${RUN_ENV}"
        - "traefik.http.routers.api01_${RUN_ENV}.rule=PathPrefix(`/hello-api-01`)"
        - "traefik.http.routers.api01_${RUN_ENV}.entrypoints=web"
        - "traefik.http.services.api01_${RUN_ENV}.loadbalancer.server.port=8000"

  api02:
    image: ${root}
    entrypoint: [ "uvicorn", "api_server_02:app", "--host", "0.0.0.0", "--port", "8000" ]
    environment:
      RUN_ENV: ${RUN_ENV}
    networks:
      - traefik-net
      - app-net
    deploy:
      <<: *common-deploy
      replicas: 3
      labels:
        - "traefik.enable=true"
        - "traefik.env=${RUN_ENV}"
        - "traefik.http.routers.api02_${RUN_ENV}.rule=PathPrefix(`/hello-api-02`)"
        - "traefik.http.routers.api02_${RUN_ENV}.entrypoints=web"
        - "traefik.http.services.api02_${RUN_ENV}.loadbalancer.server.port=8000"

  grpc01:
    image: ${root}
    entrypoint: [ "python", "grpc_server_01.py" ]
    environment:
      RUN_ENV: ${RUN_ENV}
    networks:
      - traefik-net
      - app-net
    deploy:
      <<: *common-deploy
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.env=${RUN_ENV}"
        # Route hello01.HelloService01/* to this backend
        - "traefik.http.routers.grpc01_${RUN_ENV}.rule=PathPrefix(`/hello01.HelloService01`)"
        - "traefik.http.routers.grpc01_${RUN_ENV}.entrypoints=grpc"
        - "traefik.http.services.grpc01_${RUN_ENV}.loadbalancer.server.port=50051"
        - "traefik.http.services.grpc01_${RUN_ENV}.loadbalancer.server.scheme=h2c"
        # Reflection router — grpcurl list/describe hits this service
        # Priority is lower (higher number) so specific service routes win
        # - "traefik.http.routers.grpc_reflect_${RUN_ENV}.rule=PathPrefix(`/grpc.reflection`)"
        # - "traefik.http.routers.grpc_reflect_${RUN_ENV}.entrypoints=grpc"
        # - "traefik.http.routers.grpc_reflect_${RUN_ENV}.priority=1"
        # - "traefik.http.routers.grpc_reflect_${RUN_ENV}.service=grpc01_${RUN_ENV}"

  grpc02:
    image: ${root}
    entrypoint: [ "python", "grpc_server_02.py" ]
    environment:
      RUN_ENV: ${RUN_ENV}
    networks:
      - traefik-net
      - app-net
    deploy:
      <<: *common-deploy
      replicas: 2
      labels:
        - "traefik.enable=true"
        - "traefik.env=${RUN_ENV}"
        # Route hello02.HelloService02/* to this backend
        - "traefik.http.routers.grpc02_${RUN_ENV}.rule=PathPrefix(`/hello02.HelloService02`)"
        - "traefik.http.routers.grpc02_${RUN_ENV}.entrypoints=grpc"
        - "traefik.http.services.grpc02_${RUN_ENV}.loadbalancer.server.port=50051"
        - "traefik.http.services.grpc02_${RUN_ENV}.loadbalancer.server.scheme=h2c"

networks:
  app-net:
    external: true
  traefik-net:
    external: true
    name: traefik-${RUN_ENV}
